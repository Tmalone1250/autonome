services:
  autonome-orchestrator:
    build:
      context: ..
      dockerfile: autonome/Dockerfile
    container_name: autonome_orchestrator
    command: ["uvicorn", "orchestrator.engine:app", "--host", "0.0.0.0", "--port", "8001"]
    network_mode: "host"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://127.0.0.1:11434}
      - WORKER_URL=http://127.0.0.1:8000
    restart: unless-stopped
